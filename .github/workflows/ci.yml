name: CI

on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned to full commit SHAs; the comment names the release each SHA belongs to.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Folio.slnx

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: dotnet format Folio.slnx --verify-no-changes --no-restore

      - name: Build (warnings are errors)
        run: dotnet build Folio.slnx --configuration Release --no-restore

      - name: Architecture tests
        run: dotnet test tests/Architecture.slnx --configuration Release --no-build --logger "trx" --results-directory TestResults/Architecture

      - name: Unit tests
        if: success() || failure()
        run: dotnet test tests/Unit.slnx --configuration Release --no-build --logger "trx" --results-directory TestResults/Unit

      - name: Integration tests
        if: success() || failure()
        run: dotnet test tests/Integration.slnx --configuration Release --no-build --logger "trx" --results-directory TestResults/Integration


      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
