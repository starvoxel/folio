name: CI

# Every job runs on Windows, the platform Folio ships on first, except `changes`, a one-call
# job that decides whether a Markdown-only pull request may skip the test jobs. macOS runs the same
# chain daily (macos-daily.yml). Linux is not a v1 platform and is otherwise used only for the
# AD-18 network capture, which belongs to the Electron foundations plan.
#
# The order follows project-standards.md: static checks and the architecture tests first, then unit
# and integration tests in parallel (nearly all of their time is setting up a runner, so waiting for
# one another would only add minutes), then the end-to-end tests once both have passed. Third-party actions are pinned to full commit SHAs; the comment
# names the release each SHA belongs to. No stable Node bundles npm 12 yet (Node 24 LTS bundles
# npm 11), so every job installs it explicitly.
#
# It runs on pull requests only, not again on push to main. That is safe because branch protection
# requires a pull request's branch to be up to date with main before it merges, so the pull-request
# run is a run of exactly what lands. If that setting is ever switched off, add `push` back.
on:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A pull request that changes only Markdown files skips the unit, integration and end-to-end
  # jobs. They are skipped with `if` rather than a workflow-level `paths-ignore`: a workflow that
  # never starts leaves its required checks pending forever, whereas a skipped job counts as
  # passed. Static checks still run because the formatter checks Markdown, but on a Markdown-only
  # change they skip every step except the install and the formatter. Linux is used here only
  # because this job is a single API call.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      # The file list comes from the API, not a checkout: there is nothing to download, and a
      # transient failure is retried below.
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Any non-.md file, at any depth, counts as code. The old path of a rename is listed too,
          # so moving code into a .md file still counts. Try up to three times, then fail the job
          # rather than skip the tests.
          files=
          for attempt in 1 2 3; do
            if files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" \
              --jq '.[] | .filename, (.previous_filename // empty)'); then
              break
            fi
            echo "::warning::Listing the changed files failed (attempt $attempt of 3)"
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done
          echo "Changed files:"
          echo "$files"
          # The API lists at most 3000 files; at that size, assume code. A here-string, not a pipe:
          # pipefail would turn grep -q closing early into a failure.
          if [ "$(wc -l <<< "$files")" -ge 3000 ] || grep -qv '\.md$' <<< "$files"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Markdown-only change: unit, integration and end-to-end tests skipped"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  static-checks:
    name: Static checks
    needs: [changes]
    # Runs even if `changes` failed, so a failure there cannot skip the checks. The code-only steps
    # below test for `!= 'false'`, so an empty output from a failed `changes` also runs them.
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    steps:
      # Full history: the architecture index computes a doc's staleness from git (key_files changes
      # against the commits that edited the doc).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install npm 12
        run: npm install -g npm@12 && npm --version

      - name: Install from the lockfile
        run: npm ci

      - name: Verify registry signatures
        if: needs.changes.outputs.code != 'false'
        run: |
          # The registry sometimes answers an attestation lookup with a non-JSON body. Try up to three
          # times, then fail: a genuine signature failure fails all three.
          for attempt in 1 2 3; do
            npm audit signatures && exit 0
            echo "::warning::npm audit signatures failed (attempt $attempt of 3)"
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          exit 1

      - name: An unreviewed install script must fail the install
        if: needs.changes.outputs.code != 'false'
        run: npm run check:install-policy

      - name: Lint
        if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
        run: npm run lint

      - name: Formatter check
        if: ${{ !cancelled() }}
        run: npm run format:check

      - name: Type check
        if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
        run: npm run typecheck

      - name: Architecture tests and licence check
        if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
        run: npm run test:architecture

      # ai-foundation's reusable action, pinned to a release commit; Dependabot bumps the pin. It
      # needs the full history and Node, which the steps above set up.
      - name: AIF checks
        if: ${{ !cancelled() }}
        uses: starvoxel/ai-foundation/.github/actions/checks@<v0.5.0-release-sha> # v0.5.0

  unit-tests:
    name: Unit tests
    needs: [static-checks, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm install -g npm@12 && npm --version
      - run: npm ci
      - run: npm run test:unit

  integration-tests:
    name: Integration tests
    needs: [static-checks, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm install -g npm@12 && npm --version
      - run: npm ci

      # The renderer tests drive a real Chromium, which Playwright downloads separately from npm. The
      # download takes minutes, so it is cached per Playwright version.
      - name: Choose where the browser lives and which version to cache
        id: playwright
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/playwright-browsers" >> "$GITHUB_ENV"
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore the Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/playwright-browsers
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # A no-op when the cache was restored, a download when it was not. There is no --with-deps:
      # on Windows it installs the Media Foundation feature, which took 2m37s on a hosted runner,
      # and the tests play no media. Put it back if Chromium fails to start without it.
      - name: Install the browser Playwright needs
        run: npx playwright install chromium

      - run: npm run test:integration

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: integration-screenshots
          path: test-results/screenshots
          if-no-files-found: ignore

  end-to-end-tests:
    name: End-to-end tests
    needs: [changes, unit-tests, integration-tests]
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm install -g npm@12 && npm --version
      - run: npm ci

      # The tests drive the exact packaged binary; there is no separate test build (AD-16). The
      # tests attach to Electron's own Chromium, so no Playwright browser is downloaded here.
      - name: Build and package the app
        run: npm run package

      - name: Run the end-to-end tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: e2e-results-windows
          path: test-results/e2e
          if-no-files-found: ignore
