name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Folio.slnx

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: dotnet format Folio.slnx --verify-no-changes --no-restore

      - name: Build (warnings are errors)
        run: dotnet build Folio.slnx --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test tests/Unit.slnx --configuration Release --no-build --logger "trx" --results-directory TestResults/Unit

      - name: Integration tests
        if: success() || failure()
        run: dotnet test tests/Integration.slnx --configuration Release --no-build --logger "trx" --results-directory TestResults/Integration

      - name: Validation tests
        if: success() || failure()
        run: dotnet test tests/Validation.slnx --configuration Release --no-build --logger "trx" --results-directory TestResults/Validation

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
