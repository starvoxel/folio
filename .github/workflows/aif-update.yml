name: AIF bundle update

# Refreshes the committed ai-foundation install (.claude/) and replaces the one open update pull
# request with a fresh one when anything changed. The logic is ai-foundation's reusable workflow;
# this file only sets the schedule and passes the Bitwarden settings, which live in the
# repository's Actions settings: the secret BWS_ACCESS_TOKEN and the variables
# AIF_UPDATE_TOKEN_SECRET_ID and, off the US cloud, BWS_CLOUD_REGION.
on:
  schedule:
    - cron: '47 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    name: Update AIF bundles
    uses: starvoxel/ai-foundation/.github/workflows/update-bundles.yml@<v0.5.0-release-sha> # v0.5.0
    with:
      token-secret-id: ${{ vars.AIF_UPDATE_TOKEN_SECRET_ID }}
      cloud-region: ${{ vars.BWS_CLOUD_REGION || 'us' }}
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
