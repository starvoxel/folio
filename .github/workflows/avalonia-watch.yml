name: Avalonia watch

# Weekly check on what the newest stable Avalonia targets, so a .NET bump is a deliberate decision.
# Fails when Avalonia ships a target framework newer than the one in Directory.Build.props (time to
# bump the target and the SDK pin in global.json). Warns when a newer stable Avalonia than the pinned
# one exists; Directory.Packages.props explains why the pin waits on FluentAvalonia.
on:
  schedule:
    - cron: "43 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  avalonia-targets:
    name: Avalonia target frameworks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare Avalonia with this repository
        shell: bash
        run: |
          set -euo pipefail
          base=https://api.nuget.org/v3-flatcontainer/avalonia

          project_tfm=$(grep -oE '<TargetFramework>net[0-9.]+' Directory.Build.props | sed 's/<TargetFramework>//')
          pinned=$(grep -oE '<PackageVersion Include="Avalonia" Version="[^"]+"' Directory.Packages.props | grep -oE '[0-9][^"]*')
          latest=$(curl -fsS "$base/index.json" | jq -r '.versions[]' | grep -v -- '-' | sort -V | tail -n 1)
          avalonia_tfms=$(curl -fsS "$base/$latest/avalonia.nuspec" | grep -oE 'targetFramework="net[0-9.]+"' | grep -oE 'net[0-9.]+' | sort -uV)
          newest_tfm=$(echo "$avalonia_tfms" | tail -n 1)

          echo "Project targets:        $project_tfm"
          echo "Pinned Avalonia:        $pinned"
          echo "Latest stable Avalonia: $latest"
          echo "Its target frameworks:  $(echo $avalonia_tfms)"

          if [ "$latest" != "$pinned" ]; then
            echo "::warning::Newer stable Avalonia available: $latest (pinned $pinned)"
          fi

          if [ "$(printf '%s\n%s\n' "$project_tfm" "$newest_tfm" | sort -V | tail -n 1)" != "$project_tfm" ]; then
            echo "::error::Avalonia $latest targets $newest_tfm, newer than this project's $project_tfm"
            exit 1
          fi
