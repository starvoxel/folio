name: Nightly

# Early warning for breakage from newer SDK patches and feature bands. Pull requests build against the
# SDK pinned in global.json; this job installs the newest 10.0.x SDK, which global.json's
# rollForward: latestFeature accepts, and runs the same checks without the NuGet cache.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

# Actions are pinned to full commit SHAs; the comment names the release each SHA belongs to.
permissions:
  contents: read

jobs:
  latest-sdk:
    name: Latest .NET 10 SDK (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET (latest 10.0.x SDK)
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Show SDK version
        run: dotnet --info

      - name: Restore
        run: dotnet restore Folio.slnx

      - name: Check formatting
        run: dotnet format Folio.slnx --verify-no-changes --no-restore

      - name: Build (warnings are errors)
        run: dotnet build Folio.slnx --configuration Release --no-restore

      - name: Architecture tests
        run: dotnet test tests/Architecture.slnx --configuration Release --no-build

      - name: Unit tests
        if: success() || failure()
        run: dotnet test tests/Unit.slnx --configuration Release --no-build

      - name: Integration tests
        if: success() || failure()
        run: dotnet test tests/Integration.slnx --configuration Release --no-build
