name: tauri-extras

on:
  push:
    branches: [spike/slice-tauri]
    paths-ignore: ['*.md', 'tauri/evidence/**', 'EFFORT-LOG.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-g1-pkg:
    name: G1 capture, packaging and sandbox (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            tauri/package-lock.json
            tauri/e2e/package-lock.json
      - name: Prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev patchelf xvfb xdotool rpm tcpdump strace iproute2 imagemagick dbus-daemon x11-utils gir1.2-webkit2-4.1 python3-gi fonts-noto-cjk fonts-noto-core
          mkdir -p test-results
      - run: |
          npm ci
          (cd e2e && npm ci)
      - name: Build shipped bundles and the test binary
        run: |
          npm run build:ui
          npx tauri build --bundles deb,rpm,appimage 2>&1 | tail -15
          scripts/build-e2e.sh 2>&1 | tail -3
      - name: WebKitGTK default settings (what wry leaves untouched)
        run: xvfb-run -a python3 scripts/webkit-settings.py 2>&1 | grep -vi "warning\|critical" | tee test-results/webkit-settings-linux.txt
      - name: Package install, launch, sandbox state
        run: scripts/linux-pkg-check.sh test-results/linux-pkg
      - name: Capture A, driven through every page then five minutes idle, outbound packets visible (sink route)
        run: |
          sudo env "PATH=$PATH" "HOME=$HOME" CAPTURE_IDLE_S=300 scripts/capture.sh sink capture/driven-sink scripts/capture-driven.sh 2>&1 | tail -30
      - name: Capture B, shipped binary (no driver), launch and five minutes idle, loopback-only namespace
        run: |
          sudo env "PATH=$PATH" "HOME=$HOME" FOLIO_DATA_DIR="$GITHUB_WORKSPACE/fixtures" scripts/capture.sh noroute capture/release-idle-noroute \
            timeout -s INT 330 xvfb-run -a -s "-screen 0 1440x900x24" dbus-run-session -- src-tauri/target/release/folio || true
      - name: Capture C, shipped binary, sink route, launch and five minutes idle
        run: |
          sudo env "PATH=$PATH" "HOME=$HOME" FOLIO_DATA_DIR="$GITHUB_WORKSPACE/fixtures" scripts/capture.sh sink capture/release-idle-sink \
            timeout -s INT 330 xvfb-run -a -s "-screen 0 1440x900x24" dbus-run-session -- src-tauri/target/release/folio || true
      - name: Analyse
        run: |
          sudo chown -R "$USER" capture
          for d in driven-sink release-idle-noroute release-idle-sink; do echo "=== $d"; node scripts/analyze-capture.mjs capture/$d || true; done | tee test-results/capture-analysis.txt
      - name: Commit evidence to the branch
        if: always()
        run: scripts/ci-commit.sh extras-linux capture/driven-sink/interfaces.txt capture/driven-sink/capture.txt capture/driven-sink/strace.log capture/release-idle-noroute/capture.txt capture/release-idle-noroute/strace.log capture/release-idle-sink/capture.txt capture/release-idle-sink/strace.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: extras-linux
          path: |
            tauri/test-results/**
            !tauri/test-results/wdio-logs/**
            tauri/capture/*/interfaces.txt
            tauri/capture/*/routes.txt
            tauri/capture/*/capture.txt
            tauri/capture/*/strace.log
          if-no-files-found: warn

  a11y:
    name: F3 platform accessibility tree (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-latest]
    defaults:
      run:
        shell: bash
        working-directory: tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            tauri/package-lock.json
            tauri/e2e/package-lock.json
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev patchelf xvfb xdotool at-spi2-core python3-gi gir1.2-atspi-2.0 dbus-x11 fonts-noto-cjk fonts-noto-core
      - run: |
          npm ci
          (cd e2e && npm ci)
          mkdir -p test-results
      - name: Build the test binary
        run: scripts/build-e2e.sh 2>&1 | tail -3
      - name: Dump the platform accessibility tree
        run: |
          cd e2e
          if [ "$RUNNER_OS" = Linux ]; then
            FOLIO_SPEC=./specs/a11y.e2e.ts dbus-run-session -- ../scripts/atspi-wrap.sh npx wdio run wdio.conf.ts 2>&1 | tail -40
          else
            FOLIO_SPEC=./specs/a11y.e2e.ts npx wdio run wdio.conf.ts 2>&1 | tail -40
          fi
      - name: Commit evidence to the branch
        if: always()
        run: scripts/ci-commit.sh a11y-${{ runner.os }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: a11y-${{ runner.os }}
          path: tauri/test-results/a11y-platform/**
          if-no-files-found: warn

  windows-privacy:
    name: G1 Windows socket sampling and WebView2 controls (windows-2025)
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            tauri/package-lock.json
            tauri/e2e/package-lock.json
      - run: |
          npm ci
          Push-Location e2e
          npm ci
          Pop-Location
          New-Item -ItemType Directory -Force test-results | Out-Null
      - name: Build the shipped binary and the test binary
        shell: bash
        run: |
          npm run build:ui
          (cd src-tauri && cargo build --release 2>&1 | tail -2)
          scripts/build-e2e.sh 2>&1 | tail -2
      - name: Versions and WebView2 locations
        run: |
          $pv = (Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}').pv
          "WebView2 runtime $pv" | Tee-Object test-results/webview2-version.txt
          Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application" -Directory | Select-Object -ExpandProperty Name | Tee-Object -Append test-results/webview2-version.txt
          (Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application\$pv" -Recurse -File | Measure-Object Length -Sum).Sum / 1MB | ForEach-Object { "installed runtime size MB: $([math]::Round($_,0))" } | Tee-Object -Append test-results/webview2-version.txt
      - name: Sampler validation, positive control (the web view reaches example.com)
        run: |
          $env:FOLIO_AUTOMATION = '1'
          $sampler = Start-Process pwsh -ArgumentList '-NoProfile','-File','scripts/win-net-sample.ps1','-Out','test-results/win-net/control','-Seconds','60' -PassThru
          cd e2e; $env:FOLIO_SPEC = './specs/control.e2e.ts'; npx wdio run wdio.conf.ts 2>&1 | Select-String 'CONTROL|passing|failing'
          cd ..; $sampler | Wait-Process -Timeout 90
          Get-Content test-results/win-net/control/summary.txt
      - name: Driven scenario then five minutes idle, default WebView2 settings, sampler and pktmon
        run: |
          pktmon filter remove; pktmon start --capture --pkt-size 0 -f test-results/win-net/default-pktmon.etl | Out-Null
          $sampler = Start-Process pwsh -ArgumentList '-NoProfile','-File','scripts/win-net-sample.ps1','-Out','test-results/win-net/default','-Seconds','400' -PassThru
          cd e2e; $env:CAPTURE_IDLE_S = '300'; $env:FOLIO_SPEC = './specs/capture.e2e.ts'; npx wdio run wdio.conf.ts 2>&1 | Select-String 'LAUNCHED|PAGE|USED|IDLE|passing|failing'
          cd ..; $sampler | Wait-Process -Timeout 200
          pktmon stop | Out-Null; pktmon etl2txt test-results/win-net/default-pktmon.etl -o test-results/win-net/default-pktmon.txt | Out-Null
          pwsh -NoProfile -File scripts/pktmon-summary.ps1 -Txt test-results/win-net/default-pktmon.txt -Out test-results/win-net/default-pktmon-summary.txt
          Remove-Item test-results/win-net/default-pktmon.etl -ErrorAction SilentlyContinue
          Get-Content test-results/win-net/default/summary.txt
      - name: Same, with WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS set to network-quieting Chromium switches
        run: |
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--disable-background-networking --disable-component-update --disable-sync --no-pings --metrics-recording-only --disable-domain-reliability --disable-features=msSmartScreenProtection'
          pktmon filter remove; pktmon start --capture --pkt-size 0 -f test-results/win-net/args-pktmon.etl | Out-Null
          $sampler = Start-Process pwsh -ArgumentList '-NoProfile','-File','scripts/win-net-sample.ps1','-Out','test-results/win-net/args','-Seconds','200' -PassThru
          cd e2e; $env:CAPTURE_IDLE_S = '120'; $env:FOLIO_SPEC = './specs/capture.e2e.ts'; npx wdio run wdio.conf.ts 2>&1 | Select-String 'LAUNCHED|IDLE|passing|failing'
          cd ..; $sampler | Wait-Process -Timeout 120
          pktmon stop | Out-Null; pktmon etl2txt test-results/win-net/args-pktmon.etl -o test-results/win-net/args-pktmon.txt | Out-Null
          pwsh -NoProfile -File scripts/pktmon-summary.ps1 -Txt test-results/win-net/args-pktmon.txt -Out test-results/win-net/args-pktmon-summary.txt
          Remove-Item test-results/win-net/args-pktmon.etl -ErrorAction SilentlyContinue
          Get-Content test-results/win-net/args/summary.txt
      - name: Shipped binary (no driver) launch and two minutes idle, default settings
        run: |
          $env:FOLIO_DATA_DIR = "$env:GITHUB_WORKSPACE\fixtures"
          pktmon filter remove; pktmon start --capture --pkt-size 0 -f test-results/win-net/shipped-pktmon.etl | Out-Null
          $app = Start-Process src-tauri/target/release/folio.exe -PassThru
          pwsh -NoProfile -File scripts/win-net-sample.ps1 -Out test-results/win-net/shipped -Seconds 130
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          pktmon stop | Out-Null; pktmon etl2txt test-results/win-net/shipped-pktmon.etl -o test-results/win-net/shipped-pktmon.txt | Out-Null
          pwsh -NoProfile -File scripts/pktmon-summary.ps1 -Txt test-results/win-net/shipped-pktmon.txt -Out test-results/win-net/shipped-pktmon-summary.txt
          Remove-Item test-results/win-net/shipped-pktmon.etl -ErrorAction SilentlyContinue
      - name: The one documented WebView2 telemetry-adjacent policy (ExperimentationAndConfigurationServiceControl=0), shipped binary, two minutes
        run: |
          $key = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name 'ExperimentationAndConfigurationServiceControl' -Value 0 -PropertyType DWord -Force | Out-Null
          Get-ItemProperty $key | Out-String | Tee-Object test-results/win-net/policy-set.txt
          $env:FOLIO_DATA_DIR = "$env:GITHUB_WORKSPACE\fixtures"
          $app = Start-Process src-tauri/target/release/folio.exe -PassThru
          pwsh -NoProfile -File scripts/win-net-sample.ps1 -Out test-results/win-net/policy -Seconds 130
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          Remove-Item -Path $key -Recurse -Force
      - name: Reverse lookup of the remote addresses seen from the web view
        run: |
          $ips = Get-ChildItem test-results/win-net -Recurse -Filter samples.csv | ForEach-Object { Import-Csv $_.FullName } | Where-Object { $_.scope -eq 'webview-tree' -and $_.remote -match '^\d' } | ForEach-Object { ($_.remote -split ':')[0] } | Sort-Object -Unique
          $ips | ForEach-Object { $r = try { (Resolve-DnsName $_ -Type PTR -ErrorAction Stop | Select-Object -First 1 -ExpandProperty NameHost) } catch { 'no PTR record or lookup failed' }; "$_ -> $r" } | Tee-Object test-results/win-net/reverse-lookup.txt
      - name: Commit evidence to the branch
        if: always()
        shell: bash
        run: scripts/ci-commit.sh windows-privacy

  macos-network:
    name: G1 macOS network observation (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            tauri/package-lock.json
            tauri/e2e/package-lock.json
      - run: |
          npm ci
          (cd e2e && npm ci)
          mkdir -p test-results
          scripts/build-e2e.sh 2>&1 | tail -2
      - name: Capture
        run: scripts/mac-net-tauri.sh test-results/mac-net
      - name: Commit evidence to the branch
        if: always()
        run: scripts/ci-commit.sh macos-network
