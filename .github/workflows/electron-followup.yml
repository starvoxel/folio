name: electron-followup

# Follow-up measurements (FOLLOWUP-SPEC.md). Push to the Electron spike branch, or run by hand.
# Third-party actions are pinned to full commit SHAs.
on:
  push:
    branches: [spike/slice-electron]
  workflow_dispatch:
    inputs:
      only:
        description: 'Run only one job group (sr = screen reader); empty runs everything'
        required: false
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: electron

jobs:
  # F1: memory points P0..P5, default and with Chromium accessibility forced on, per OS.
  f1-memory:
    if: ${{ inputs.only == '' }}
    name: F1 memory (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, exe: out-test/Folio-linux-x64/Folio, run: 'xvfb-run -a -s "-screen 0 1440x900x24"' }
          - { os: windows-2025, exe: out-test/Folio-win32-x64/Folio.exe, run: '' }
          - { os: macos-latest, exe: out-test/Folio-darwin-arm64/Folio.app/Contents/MacOS/Folio, run: '' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install
        run: |
          npm ci
          node -e "require('fs').existsSync(require('electron')) || process.exit(1)" 2>/dev/null || node node_modules/electron/install.js
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - name: Package the test binary (release build with only the inspect fuse flipped)
        run: FOLIO_FUSE_INSPECT=1 FOLIO_OUT=out-test node scripts/package.mjs
      - name: Memory points, default
        run: mkdir -p ci-out && ${{ matrix.run }} node scripts/mem-points.mjs ${{ matrix.exe }} ci-out/f1-${{ runner.os }}-default.json
      - name: Memory points, accessibility forced on
        run: ${{ matrix.run }} node scripts/mem-points.mjs ${{ matrix.exe }} ci-out/f1-${{ runner.os }}-a11y.json --a11y
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: f1-${{ runner.os }}
          path: electron/ci-out/

  # F2 + E3: the G3 scenario on every OS, with the test binary (Playwright Electron mode) and with the exact release binary (pipe driver).
  g3-matrix:
    if: ${{ inputs.only == '' }}
    name: G3 scenario (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, rel: out/Folio-linux-x64/Folio, run: 'xvfb-run -a -s "-screen 0 1440x900x24"', plat: linux }
          - { os: windows-2025, rel: out/Folio-win32-x64/Folio.exe, run: '', plat: win32 }
          - { os: macos-latest, rel: out/Folio-darwin-arm64/Folio.app/Contents/MacOS/Folio, run: '', plat: darwin }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install
        run: |
          npm ci
          node -e "require('fs').existsSync(require('electron')) || process.exit(1)" 2>/dev/null || node node_modules/electron/install.js
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - name: Package release and test binaries
        run: |
          node scripts/package.mjs
          FOLIO_FUSE_INSPECT=1 FOLIO_OUT=out-test node scripts/package.mjs
          if [ "$RUNNER_OS" = Linux ]; then (cmp -l out/Folio-linux-x64/Folio out-test/Folio-linux-x64/Folio || true) | wc -l | xargs echo "executable bytes differing:"; fi
      - name: Slice and guard tests on the test binary (Playwright Electron driver)
        id: t1
        continue-on-error: true
        run: ${{ matrix.run }} npx playwright test slice.spec.ts guard.spec.ts
      - name: Keep screenshots of driver 1
        if: always()
        run: mkdir -p ci-out && cp -r test-results/shots/${{ matrix.plat }} ci-out/shots-electron-driver || true; cp test-results/cold-start-*.json ci-out/cold-start-electron-driver.json || true
      - name: Slice and guard tests on the exact release binary (pipe driver)
        id: t2
        continue-on-error: true
        env:
          FOLIO_DRIVER: pipe
          FOLIO_EXE: ${{ matrix.rel }}
        run: ${{ matrix.run }} npx playwright test slice.spec.ts guard.spec.ts
      - name: Keep screenshots of driver 2
        if: always()
        run: cp -r test-results/shots/${{ matrix.plat }} ci-out/shots-pipe-driver || true; cp test-results/cold-start-*.json ci-out/cold-start-pipe-driver.json || true
      - name: Result summary
        if: always()
        run: |
          echo "test binary driver ${{ steps.t1.outcome }}, release binary pipe driver ${{ steps.t2.outcome }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: g3-${{ runner.os }}
          path: electron/ci-out/

  # F3: what the operating system's accessibility API reports.
  a11y-platform:
    if: ${{ inputs.only == '' }}
    name: F3 platform a11y (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, exe: out-test/Folio-linux-x64/Folio }
          - { os: windows-2025, exe: out-test/Folio-win32-x64/Folio.exe }
          - { os: macos-latest, exe: out-test/Folio-darwin-arm64/Folio.app/Contents/MacOS/Folio }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install
        run: |
          npm ci
          node -e "require('fs').existsSync(require('electron')) || process.exit(1)" 2>/dev/null || node node_modules/electron/install.js
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb python3-gi gir1.2-atspi-2.0 at-spi2-core dbus-x11
      - name: Package test binary
        run: FOLIO_FUSE_INSPECT=1 FOLIO_OUT=out-test node scripts/package.mjs
      - name: Dump the platform accessibility tree
        continue-on-error: true
        run: |
          mkdir -p ci-out/a11y-platform
          if [ "$RUNNER_OS" = Linux ]; then timeout 400 dbus-run-session -- ./scripts/atspi-run.sh ${{ matrix.exe }} ci-out/a11y-platform; else node scripts/a11y-platform.mjs ${{ matrix.exe }} ci-out/a11y-platform; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: a11y-${{ runner.os }}
          path: electron/ci-out/

  # F2: best-effort network observation on macOS.
  macos-network:
    if: ${{ inputs.only == '' }}
    name: F2 macOS network observation
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: |
          npm ci
          node -e "require('fs').existsSync(require('electron')) || process.exit(1)" 2>/dev/null || node node_modules/electron/install.js
      - run: FOLIO_FUSE_INSPECT=1 FOLIO_OUT=out-test node scripts/package.mjs
      - name: Capture
        continue-on-error: true
        run: ./scripts/mac-net.sh out-test/Folio-darwin-arm64/Folio.app/Contents/MacOS/Folio ci-out/mac-net
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mac-network
          path: electron/ci-out/

  # E1: which variants make a non-loopback connect() or send packets, with real IPv6 available.
  e1-matrix:
    if: ${{ inputs.only == '' }}
    name: E1 connect() matrix (Linux, IPv6 sink)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: |
          npm ci
          node -e "require('fs').existsSync(require('electron')) || process.exit(1)" 2>/dev/null || node node_modules/electron/install.js
      - run: node scripts/package.mjs
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb tcpdump strace iproute2
      - name: Matrix
        run: sudo env "PATH=$PATH" "HOME=$HOME" ./scripts/e1-matrix.sh out/Folio-linux-x64/Folio ci-out/e1 | tee ci-out-e1.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e1-matrix
          path: electron/ci-out/

  # E2: Chromium sandbox on Linux, and what a deb / AppImage needs.
  e2-sandbox:
    if: ${{ inputs.only == '' }}
    name: E2 sandbox (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: |
          npm ci
          node -e "require('fs').existsSync(require('electron')) || process.exit(1)" 2>/dev/null || node node_modules/electron/install.js
      - run: node scripts/package.mjs
      - name: Build deb and AppImage
        run: npx electron-builder --linux deb AppImage --publish never 2>&1 | tail -15; ls -la release-pkg
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - name: Sandbox matrix
        run: mkdir -p ci-out && ./scripts/e2-sandbox-ci.sh out/Folio-linux-x64 2>&1 | tee ci-out/e2-sandbox.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2-sandbox
          path: electron/ci-out/

  # E5: ASAR integrity fuse on Windows, whether Chromium's sandbox is on for the Windows release build, installer size.
  e5-windows:
    if: ${{ inputs.only == '' }}
    name: E5 Windows (asar fuse, sandbox, installer)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: |
          npm ci
          node -e "require('fs').existsSync(require('electron')) || process.exit(1)" 2>/dev/null || node node_modules/electron/install.js
      - name: Release build with the ASAR integrity fuse, and a test copy
        run: |
          FOLIO_FUSE_ASAR_INTEGRITY=1 FOLIO_FUSE_INSPECT=1 FOLIO_OUT=out-asar node scripts/package.mjs
          npx @electron/fuses read --app out-asar/Folio-win32-x64/Folio.exe
      - name: ASAR integrity, untouched then tampered
        continue-on-error: true
        run: |
          mkdir -p ci-out
          node scripts/asar-integrity-check.mjs out-asar/Folio-win32-x64 2>&1 | tee ci-out/asar-integrity-win.txt
      - name: ASAR integrity with electron-builder (embeds the digest), untouched then tampered
        continue-on-error: true
        run: |
          npx electron-builder --win --dir --config scripts/builder-asar-test.json --publish never 2>&1 | tail -5
          npx @electron/fuses read --app release-asar/win-unpacked/folio-spike.exe
          node scripts/asar-integrity-check.mjs release-asar/win-unpacked folio-spike 2>&1 | tee ci-out/asar-integrity-win-builder.txt
      - name: Sandbox state of every process
        continue-on-error: true
        run: |
          FOLIO_FUSE_INSPECT=1 FOLIO_OUT=out-test node scripts/package.mjs >/dev/null
          node scripts/sandbox-state.mjs out-test/Folio-win32-x64/Folio.exe 2>&1 | tee ci-out/sandbox-state-win.txt
      - name: NSIS installer
        continue-on-error: true
        run: |
          node scripts/package.mjs >/dev/null
          npx electron-builder --win nsis --publish never 2>&1 | tail -8
          ls -la release-pkg | tee ci-out/installer-win.txt
      - name: npm audit (all)
        continue-on-error: true
        run: npm audit 2>&1 | tail -40 | tee ci-out/npm-audit.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e5-windows
          path: electron/ci-out/

  # F3 stretch: a real screen reader (Guidepup: NVDA on Windows, VoiceOver on macOS). Time-boxed; failure is a finding.
  screen-reader:
    if: ${{ inputs.only == '' || inputs.only == 'sr' }}
    name: F3 stretch screen reader (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            exe: out-test/Folio-win32-x64/Folio.exe
          - os: macos-latest
            exe: out-test/Folio-darwin-arm64/Folio.app/Contents/MacOS/Folio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install
        run: |
          npm ci
          node -e "require('fs').existsSync(require('electron')) || process.exit(1)" 2>/dev/null || node node_modules/electron/install.js
      - name: Package the test binary
        run: FOLIO_FUSE_INSPECT=1 FOLIO_OUT=out-test node scripts/package.mjs
      - name: Install Guidepup and set up the screen reader
        continue-on-error: true
        working-directory: electron/scripts/sr
        run: |
          npm install
          npx @guidepup/setup setup --ci 2>&1 | tail -30
          if [ "$RUNNER_OS" = Windows ]; then npx @guidepup/setup install nvda 2>&1 | tail -30; fi
      - name: Run the screen reader scenario
        continue-on-error: true
        run: |
          mkdir -p ci-out
          node scripts/sr/run.mjs ${{ matrix.exe }} ci-out/screen-reader.txt 2>&1 | tail -80
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sr-${{ runner.os }}
          path: electron/ci-out/
