name: avalonia-sr

on:
  push:
    branches: [spike/slice-avalonia]
    paths: ['.github/workflows/avalonia-sr.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  AVALONIA_TELEMETRY_OPTOUT: '1'

jobs:
  nvda:
    name: NVDA ${{ matrix.cand }} (Windows)
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cand: c0, app: '--a11y-fix', build: '' }
          - { cand: c1, app: '--a11y-fix --table c1', build: '' }
          - { cand: c2, app: '--a11y-fix --table c2', build: '' }
          - { cand: c3, app: '--a11y-fix', build: '-p:DataGridImpl=pro' }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build
        shell: bash
        working-directory: avalonia
        run: |
          dotnet build Slice -c Release ${{ matrix.build }}
          dotnet build Cli -c Release
      - name: Install Guidepup and set up NVDA
        continue-on-error: true
        working-directory: avalonia/tools/sr
        run: |
          npm install
          npx @guidepup/setup setup --ci 2>&1 | Select-Object -Last 30
          npx @guidepup/setup install nvda 2>&1 | Select-Object -Last 30
      - name: Run the scenario
        continue-on-error: true
        shell: bash
        working-directory: avalonia
        run: |
          mkdir -p ../out
          start=$(date +%s)
          node tools/sr/run.mjs "$PWD/Slice/bin/Release/net10.0/FolioSlice.exe" "$PWD/Cli/bin/Release/net10.0/folio-slice-cli.exe" "$PWD/../fixtures" "$PWD/../out/nvda.txt" ${{ matrix.app }} 2>&1 | tail -80
          echo "scenario wall seconds: $(( $(date +%s) - start ))" | tee -a ../out/nvda.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: sr-nvda-${{ matrix.cand }}
          path: out/
  voiceover:
    name: VoiceOver (macOS) c0 and c2
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cand: c0, app: '--a11y-fix' }
          - { cand: c2, app: '--a11y-fix --table c2' }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build
        working-directory: avalonia
        run: |
          dotnet build Slice -c Release
          dotnet build Cli -c Release
      - name: Install Guidepup and set up VoiceOver
        continue-on-error: true
        working-directory: avalonia/tools/sr
        run: |
          npm install
          npx @guidepup/setup setup --ci 2>&1 | tail -30
      - name: Run the scenario
        continue-on-error: true
        working-directory: avalonia
        run: |
          mkdir -p ../out
          node tools/sr/run.mjs "$PWD/Slice/bin/Release/net10.0/FolioSlice" "$PWD/Cli/bin/Release/net10.0/folio-slice-cli" "$PWD/../fixtures" "$PWD/../out/voiceover.txt" ${{ matrix.app }} 2>&1 | tail -80
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: sr-voiceover-${{ matrix.cand }}
          path: out/
