name: tauri-diag

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev patchelf xvfb x11-utils imagemagick xdotool
          mkdir -p test-results
          npm ci && npm run build:ui
          (cd src-tauri && cargo build --release 2>&1 | tail -1)
      - name: Launch variants
        run: scripts/diag-shipped.sh "$PWD/src-tauri/target/release/folio" test-results/diag 2>&1 | tee test-results/diag/summary.txt
      - name: Commit evidence to the branch
        if: always()
        run: scripts/ci-commit.sh diag
