name: Dependabot auto-merge

# Enables auto-merge on the Dependabot "patches" group only. Minors, majors, Avalonia and
# FluentAvalonia PRs stay manual. The PR still has to pass the required checks in branch
# protection before GitHub merges it (needs "Allow auto-merge" enabled in repository settings).
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - if: steps.metadata.outputs.dependency-group == 'patches'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
