[package]
name = "folio"
version = "0.0.1"
description = "Folio stack-selection spike: Tauri slice"
authors = ["Folio spike"]
edition = "2021"
license = "UNLICENSED"
publish = false

[lib]
name = "folio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "=2.12.5", default-features = false, features = ["wry", "common-controls-v6", "compression"] }
# Extras for the "real app" experiments (not in the measured slice): native file dialog.
tauri-plugin-dialog = { version = "=2.8.4", optional = true }
libc = { version = "0.2", optional = true }
# Test-only: embedded WebDriver server and the WDIO helper plugin. Never compiled into the shipped build.
tauri-plugin-wdio = { version = "=1.5.1", optional = true }
tauri-plugin-wdio-webdriver = { version = "=1.5.1", optional = true }

[features]
# `extras`: atomic save, lock file, CSV drag and drop, native dialog. Off in the measured slice.
extras = ["dep:tauri-plugin-dialog", "dep:libc"]
# `automation`: lets a WebDriver client attach, but only if FOLIO_AUTOMATION=1 at run time. Off in the shipped build.
automation = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
